<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Zenndra | Under development</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #e6dcc9;
            --paper-deep: #d9ceb6;
            --ink: #14110e;
            --mute: #6f675c;
            --press: #b42318;
            --hair: rgba(20, 17, 14, 0.18);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            min-height: 100%;
            background: var(--paper);
            color: var(--ink);
        }

        body {
            font-family: Outfit, sans-serif;
            font-weight: 400;
            overflow-x: hidden;
        }

        .grain {
            pointer-events: none;
            position: fixed;
            inset: 0;
            z-index: 8;
            opacity: 0.28;
            mix-blend-mode: multiply;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.55'/></svg>");
        }

        .wash {
            pointer-events: none;
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(1200px 700px at 8% 0%, rgba(255,255,255,0.35), transparent 55%),
                radial-gradient(900px 600px at 100% 100%, rgba(180, 150, 90, 0.18), transparent 50%),
                linear-gradient(180deg, var(--paper) 0%, var(--paper-deep) 100%);
        }

        .crop {
            position: fixed;
            z-index: 9;
            width: 18px;
            height: 18px;
            border-color: var(--ink);
            border-style: solid;
            opacity: 0.55;
        }

        .crop.tl { top: 18px; left: 18px; border-width: 1px 0 0 1px; }
        .crop.tr { top: 18px; right: 18px; border-width: 1px 1px 0 0; }
        .crop.bl { bottom: 18px; left: 18px; border-width: 0 0 1px 1px; }
        .crop.br { bottom: 18px; right: 18px; border-width: 0 1px 1px 0; }

        .sheet {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr auto;
            padding: 36px 48px 28px;
        }

        header, footer {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 24px;
            font-size: 11px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-weight: 500;
        }

        .wordmark {
            font-size: 13px;
            letter-spacing: 0.28em;
        }

        .meta {
            color: var(--mute);
            display: flex;
            gap: 28px;
        }

        .meta time {
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.12em;
        }

        .spine {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            position: fixed;
            left: 22px;
            top: 50%;
            translate: 0 -50%;
            z-index: 7;
            font-size: 10px;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            color: var(--mute);
        }

        main {
            display: grid;
            grid-template-columns: minmax(0, 1.35fr) minmax(240px, 0.65fr);
            gap: 8vw;
            align-items: end;
            padding: 8vh 4vw 6vh 5vw;
        }

        .hero {
            min-width: 0;
        }

        .kicker {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
            font-size: 11px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--press);
            font-weight: 500;
        }

        .reg {
            width: 11px;
            height: 11px;
            position: relative;
            flex-shrink: 0;
        }

        .reg::before,
        .reg::after {
            content: "";
            position: absolute;
            background: var(--press);
        }

        .reg::before {
            left: 50%;
            top: 0;
            width: 1px;
            height: 100%;
            translate: -50% 0;
        }

        .reg::after {
            top: 50%;
            left: 0;
            height: 1px;
            width: 100%;
            translate: 0 -50%;
        }

        .reg i {
            position: absolute;
            inset: 2px;
            border: 1px solid var(--press);
            border-radius: 50%;
        }

        h1 {
            font-family: "Instrument Serif", Georgia, serif;
            font-weight: 400;
            font-size: clamp(4.2rem, 11.4vw, 10.5rem);
            line-height: 0.86;
            letter-spacing: -0.045em;
            max-width: 9ch;
        }

        h1 em {
            font-style: italic;
            font-weight: 400;
        }

        .rule {
            width: 0;
            height: 1px;
            background: var(--ink);
            margin: 36px 0 0;
            animation: draw 1.4s 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes draw {
            to { width: min(220px, 40%); }
        }

        .copy {
            padding-bottom: 12px;
            max-width: 34ch;
        }

        .sorry {
            font-family: "Instrument Serif", Georgia, serif;
            font-style: italic;
            font-size: clamp(2.1rem, 4vw, 3.4rem);
            line-height: 1.05;
            margin-bottom: 22px;
            letter-spacing: -0.03em;
        }

        .body {
            font-size: 16px;
            font-weight: 300;
            line-height: 1.65;
            color: var(--mute);
        }

        .body strong {
            color: var(--ink);
            font-weight: 500;
        }

        footer {
            border-top: 1px solid var(--hair);
            padding-top: 18px;
        }

        footer span:last-child {
            color: var(--mute);
        }

        @media (max-width: 860px) {
            .sheet { padding: 28px 22px 22px; }
            .spine { display: none; }
            .crop { display: none; }
            main {
                grid-template-columns: 1fr;
                gap: 40px;
                padding: 10vh 0 8vh;
                align-items: start;
            }
            h1 { font-size: clamp(3.4rem, 18vw, 5.6rem); }
            .meta { display: none; }
        }
    </style>
</head>
<body>
    <div class="wash" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <span class="crop tl" aria-hidden="true"></span>
    <span class="crop tr" aria-hidden="true"></span>
    <span class="crop bl" aria-hidden="true"></span>
    <span class="crop br" aria-hidden="true"></span>
    <p class="spine">Studio closed for rebuild</p>

    <div class="sheet">
        <header>
            <p class="wordmark">Zenndra</p>
            <div class="meta">
                <span>Ref 00.1</span>
                <time id="clock" datetime="">00:00:00</time>
            </div>
        </header>

        <main>
            <div class="hero">
                <p class="kicker"><span class="reg" aria-hidden="true"><i></i></span> Service paused</p>
                <h1>Under<br>develop<em>ment</em></h1>
                <div class="rule" aria-hidden="true"></div>
            </div>

            <aside class="copy">
                <p class="sorry">We are sorry.</p>
                <p class="body">
                    This service is under development. The doors are closed while we rebuild what comes next.
                    <strong> Thank you for waiting.</strong>
                </p>
            </aside>
        </main>

        <footer>
            <span>Zenndra</span>
            <span>MMXXVI</span>
        </footer>
    </div>

    <script>
        const clock = document.getElementById("clock");
        const tick = () => {
            clock.textContent = new Date().toLocaleTimeString("en-GB", { hour12: false });
        };
        tick();
        setInterval(tick, 1000);
    </script>
</body>
</html>
